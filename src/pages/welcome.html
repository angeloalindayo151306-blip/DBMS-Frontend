<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | DFMS</title>

    <link rel="icon" href="/CCS%20logo.ico" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/welcome.css" />
  </head>

  <body class="welcome-body">
    <div class="welcome-center">
      <div class="welcome-card">
        <div class="welcome-card-top">
          <div class="d-flex align-items-center gap-2">
            <img src="/CCS%20logo.jpg" alt="CCS Logo" class="welcome-logo" />
            <div class="lh-sm">
              <div class="welcome-brand-title">DFMS</div>
              <div class="welcome-brand-sub">College of Computer Studies</div>
            </div>
          </div>

          <button id="btnLogout" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </button>
        </div>

        <div id="message" class="mt-3"></div>

        <div class="welcome-card-body">
          <div class="row g-4 align-items-center">
            <!-- Avatar -->
            <div class="col-12 col-md-4 text-center">
              <div class="welcome-avatar-wrap mx-auto">
                <img id="avatar" src="/default.png" alt="Profile" class="welcome-avatar" />
              </div>
              <div class="mt-3">
                <span id="rolePill" class="badge welcome-role-pill">...</span>
              </div>
            </div>

            <!-- Info -->
            <div class="col-12 col-md-8">
              <div id="fullName" class="welcome-name">Loading...</div>
              <div id="subLine" class="welcome-subline">Loading...</div>

              <div class="welcome-info mt-3">
                <div class="welcome-info-grid">
                  <div class="welcome-info-item">
                    <div class="k">Email</div>
                    <div id="vEmail" class="v">-</div>
                  </div>

                  <div class="welcome-info-item">
                    <div class="k">Mobile</div>
                    <div id="vMobile" class="v">-</div>
                  </div>

                  <div class="welcome-info-item">
                    <div class="k">Course</div>
                    <div id="vCourse" class="v">-</div>
                  </div>

                  <div class="welcome-info-item">
                    <div class="k">Year Level</div>
                    <div id="vYear" class="v">-</div>
                  </div>

                  <div class="welcome-info-item">
                    <div class="k">Age</div>
                    <div id="vAge" class="v">-</div>
                  </div>

                  <div class="welcome-info-item">
                    <div class="k">Address</div>
                    <div id="vAddress" class="v">-</div>
                  </div>
                </div>
              </div>

              <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                <button id="btnContinue" class="btn btn-primary px-4">
                  Continue <i class="bi bi-arrow-right ms-2"></i>
                </button>
                <a href="/" class="btn btn-outline-light px-4">Back to Landing</a>
              </div>

              <div class="welcome-note mt-3">
                You will be redirected to the correct dashboard based on your role.
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script type="module" src="/js/welcome.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
